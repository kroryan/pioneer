name: "Upload AppImage Artifact"
description: "Generate and upload an AppImage artifact"

inputs:
  artifact_name:
    description: "Name of generated artifact"
    required: true
  build_slug:
    description: "platform-arch-build-flags"
    required: true
  artifact_file_name:
    description: "file name for the generated AppImage"
    default: "Pioneer-x86_64.AppImage"

runs:
  using: "composite"
  steps:
    - name: Install
      shell: bash
      run: cmake --build ./build --target install

    - name: Package Artifact
      shell: bash
      env:
        BUILD_SLUG: ${{ inputs.build_slug }}
        ARTIFACT_FILE_NAME: ${{ inputs.artifact_file_name }}
      run: |
        curl --fail --location --retry 3 \
          --output linuxdeploy-x86_64.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod a+x linuxdeploy-x86_64.AppImage
        ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
          ./linuxdeploy-x86_64.AppImage \
          --appdir "out/install/pioneer-$BUILD_SLUG" \
          --output appimage
        mv Pioneer*.AppImage "$ARTIFACT_FILE_NAME"
        test -s "$ARTIFACT_FILE_NAME"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_file_name }}
        retention-days: 14
        if-no-files-found: error
