name: Build Pioneer and Continuous Release

# Controls when the action will run.
on:
  push:
    branches:
    - master
  pull_request:
    paths:
    - 'src/**.cpp'
    - 'src/**.h'
    - '**/CMakeLists.txt'
    - '.github/workflows/build-ci.yml'
    - '.github/actions/*/action.yml'
    - 'cmake/*.cmake'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

env:
  packages: >
    mesa-common-dev
    libfreeimage-dev
    libglew-dev
    libsigc++-2.0-dev
    libvorbis-dev
    libassimp-dev
    libsdl2-dev
    libsdl2-image-dev
    libopenal-dev
    ninja-build

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  build-msvc:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
      with:
        path: pioneer

    - name: Checkout pioneer-thirdparty
      uses: actions/checkout@v6
      with:
        repository: pioneerspacesim/pioneer-thirdparty
        path: pioneer-thirdparty

    - name: Checkout ReShade headers
      uses: actions/checkout@v6
      with:
        repository: kroryan/pioneer-thirdparty
        ref: 329a2b5b6ee854e6b9037b769ea84eade8b58402
        path: pioneer-thirdparty-reshade
        sparse-checkout: win32/include/reshade

    - name: Add ReShade headers to pioneer-thirdparty
      shell: cmd
      run: |
        xcopy /E /I /Y pioneer-thirdparty-reshade\win32\include\reshade pioneer-thirdparty\win32\include\reshade

    - name: Build MSVC
      shell: cmd
      env:
        PROJECT_VERSION_INFO: ${{ github.ref_name }}
      run: |
        echo Project Version: %PROJECT_VERSION_INFO%
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd pioneer
        mkdir build
        cd build
        cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX="C:/Program Files/Pioneer" -DPIONEER_DATA_DIR="C:/Program Files/Pioneer/data" -DCMAKE_BUILD_TYPE:STRING=Release -DGIT_EXECUTABLE="c:/Program Files/Git/cmd/git.exe" -DPROJECT_VERSION_INFO="%PROJECT_VERSION_INFO%"
        cmake --build .

    - name: Build Pioneer Data
      shell: cmd
      run: |
        cd pioneer
        modelcompiler.exe -b inplace

    - name: Build Release
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd pioneer
        cd build
        cmake --build . --target install
        cmake --build . --target win-installer
        cd ..
        for %%f in (pioneer-*-win.exe) do move /Y "%%f" "Pioneer-continuous-windows-x64.exe"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: continuous-windows
        path: pioneer/Pioneer-continuous-windows-x64.exe
        retention-days: 14
        if-no-files-found: error

  build-gcc:
    runs-on: ubuntu-22.04

    steps:
    # Checkout the repository as $GITHUB_WORKSPACE
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-fast update
        sudo apt-fast install -y ${{ env.packages }}

    - name: Setup CMake
      run: |
        echo "Project Version: $(echo "${{ github.ref }}" | awk -F '/' '/pull/ { print "PR#"$3 } /heads/ { print $3 }')"
        cp scripts/CMakeBuildPresetsCI.json CMakeUserPresets.json
        cmake -G Ninja --preset linux-x64-release -DPROJECT_VERSION_INFO=$(echo "${{ github.ref }}" | awk -F '/' '/pull/ { print "PR#"$3 } /heads/ { print $3 }')

    - name: Build GCC
      run: cmake --build ./build --target all

    - name: Build Pioneer Data
      run: cmake --build ./build --target build-data

    - name: Run Tests
      run: ./build/unittest

    - name: Generate Artifacts
      uses: ./.github/actions/upload-linux
      with:
        artifact_name: Linux 64-bit
        build_slug: linux-x64-release

  build-clang:
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checkout the repository as $GITHUB_WORKSPACE
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-fast update
        sudo apt-fast install -y clang-12 ${{ env.packages }}

    - name: Setup CMake
      run: |
        echo "Project Version: $(echo "${{ github.ref }}" | awk -F '/' '/pull/ { print "PR#"$3 } /heads/ { print $3 }')"
        cp scripts/CMakeBuildPresetsCI.json CMakeUserPresets.json
        export CC=clang CXX=clang++
        cmake -G Ninja --preset linux-x64-release -DPROJECT_VERSION_INFO=$(echo "${{ github.ref }}" | awk -F '/' '/pull/ { print "PR#"$3 } /heads/ { print $3 }')

    - name: Build Clang
      run: cmake --build ./build --target all

    - name: Build Pioneer Data
      run: cmake --build ./build --target build-data

    - name: Run Tests
      run: ./build/unittest

  build-appimage:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
    # Checkout the repository as $GITHUB_WORKSPACE
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        sudo apt-fast update
        sudo apt-fast install -y ${{ env.packages }}

    - name: Setup CMake
      run: |
        cp scripts/CMakeBuildPresetsCI.json CMakeUserPresets.json
        cmake -G Ninja --preset linux-x64-release-appimage

    - name: Build GCC
      run: cmake --build ./build --target all

    - name: Build Pioneer Data
      run: cmake --build ./build --target build-data

    - name: Run Tests
      run: ./build/unittest

    - name: Generate Artifacts
      uses: ./.github/actions/upload-appimage
      with:
        artifact_name: continuous-appimage
        build_slug: linux-x64-release-appimage
        artifact_file_name: Pioneer-continuous-linux-x86_64.AppImage

  continuous-release:
    name: Update Continuous Build prerelease
    runs-on: ubuntu-latest
    needs:
    - build-msvc
    - build-gcc
    - build-clang
    - build-appimage
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: continuous-windows
        path: release-assets

    - name: Download AppImage artifact
      uses: actions/download-artifact@v8
      with:
        name: continuous-appimage
        path: release-assets

    - name: Verify release assets
      shell: bash
      run: |
        test -s release-assets/Pioneer-continuous-windows-x64.exe
        test -s release-assets/Pioneer-continuous-linux-x86_64.AppImage

    - name: Create release notes
      shell: bash
      run: |
        printf '%s\n' \
          "Triggered on $(date -u +'%Y/%m/%d, %H:%M UTC') by commit ${GITHUB_SHA::7} (@${GITHUB_ACTOR})" \
          "" \
          "This is an automated build of the latest source. It may be unstable or even crash, corrupt your save or eat your kitten. Use with caution!" \
          > release-notes.md

    - name: Move continuous tag to this commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/continuous" >/dev/null 2>&1; then
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous" \
            -f sha="${GITHUB_SHA}" \
            -F force=true
        else
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/continuous" \
            -f sha="${GITHUB_SHA}"
        fi

    - name: Create or update prerelease
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view continuous --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release edit continuous \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Continuous Build" \
            --notes-file release-notes.md \
            --prerelease
        else
          gh release create continuous \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Continuous Build" \
            --notes-file release-notes.md \
            --prerelease
        fi
        gh release upload continuous release-assets/* \
          --repo "${GITHUB_REPOSITORY}" \
          --clobber
